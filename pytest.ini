[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -v --tb=short --strict-markers
markers =
    unit: Unit tests
    integration: Integration tests
    api: API endpoint tests
    auth: Authentication tests
    admin: Admin tests
    analytics: Analytics tests
    subscriptions: Subscription tests
    inventory: Inventory tests
    tax: Tax tests
    shipping: Shipping tests
    promocodes: Promocode tests
    refunds: Refund tests
    webhooks: Webhook tests
    slow: Slow tests
    live: Live server tests
